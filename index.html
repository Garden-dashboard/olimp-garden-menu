<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Olimp Garden — Menyu</title>
<meta name="theme-color" content="#EAF4E9">
<meta name="color-scheme" content="light only">
<meta name="description" content="Olimp Garden restoranining to'liq menyusi">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Olimp Garden">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{ font-family:'Menu UI'; src:local('Segoe UI'); }
:root{
  color-scheme: light only;
  --ground:#EAF4E9; --surface:#F7FBF6; --surface-2:#DCEBDA; --surface-3:#CADFC7;
  --ink:#1E2B1C; --ink-soft:#55694F; --ink-faint:#8A9C82;
  --teal:#2F8F4E; --teal-deep:#1F6B38; --teal-tint:#DCF0DE;
  --clay:#C1652B; --clay-tint:#F3E0CE; --gold:#93702E;
  --line:rgba(30,43,28,.14); --line-strong:rgba(30,43,28,.26);
  --shadow:0 10px 28px rgba(20,35,18,.12); --shadow-lg:0 18px 48px rgba(20,35,18,.20);
  --scrim:rgba(15,25,13,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'Menu UI','Segoe UI','PT Sans','Noto Sans',system-ui,-apple-system,sans-serif;
  font-size:15.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.serif{ font-family:Georgia,'PT Serif','Noto Serif','Times New Roman',serif; }
button{ font-family:inherit; }
img{ max-width:100%; display:block; }
::selection{ background:var(--teal); color:var(--surface); }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ============ SHELL ============ */
.wrap{ max-width:1180px; margin:0 auto; }
.hide{ display:none !important; }

/* top bar */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1180px; margin:0 auto; padding:12px 18px;
  display:flex; align-items:center; gap:12px;
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand img{ width:38px; height:38px; border-radius:50%; object-fit:cover; border:1.5px solid var(--line-strong); background:var(--surface-2); flex:none; }
.brand-text{ min-width:0; }
.brand-name{ font-family:Georgia,'PT Serif',serif; font-style:italic; font-size:19px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-status{ font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; }
.status-dot{ width:6px; height:6px; border-radius:50%; flex:none; }
.status-dot.open{ background:var(--teal); box-shadow:0 0 0 3px var(--teal-tint); }
.status-dot.closed{ background:var(--clay); box-shadow:0 0 0 3px var(--clay-tint); }
.topbar-spacer{ flex:1; }
.lang-switch{ display:flex; gap:3px; background:var(--surface-2); border-radius:999px; padding:3px; flex:none; }
.lang-switch button{
  font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-soft);
  background:none; border:none; border-radius:999px; padding:6px 10px; cursor:pointer; transition:background .15s, color .15s;
}
.lang-switch button:hover{ color:var(--ink); }
.lang-switch button.active{ background:var(--surface); color:var(--teal-deep); box-shadow:var(--shadow); }
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink-soft); cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex:none;
  transition:background .15s, color .15s;
}
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
.icon-btn svg{ width:17px; height:17px; }

/* back header (category / search) */
.subbar{ display:flex; align-items:center; gap:12px; padding:12px 18px; max-width:1180px; margin:0 auto; }
.back-btn{
  display:flex; align-items:center; gap:6px; border:none; background:none; cursor:pointer;
  color:var(--ink-soft); font-size:13.5px; font-weight:600; padding:6px 4px;
}
.back-btn:hover{ color:var(--teal-deep); }
.subbar-title{ font-family:Georgia,'PT Serif',serif; font-size:21px; flex:1; text-wrap:balance; }
.subbar-count{ font-size:12px; color:var(--ink-faint); }

.catnav{
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  padding:0 18px 14px; max-width:1180px; margin:0 auto;
}
.catnav::-webkit-scrollbar{ display:none; }
.catnav button{
  flex:none; font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft);
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s, color .15s;
}
.catnav button:hover{ background:var(--surface-2); }
.catnav button.active{ background:var(--teal-tint); border-color:var(--teal); color:var(--teal-deep); }
.catnav button.cat-red{ border-color:#C0392B; }
.catnav button.cat-red.active{ background:#F9E3E0; border-color:#C0392B; color:#C0392B; }

/* search */
.search-row{ padding:0 18px 12px; max-width:1180px; margin:0 auto; }
.search-field{
  display:flex; align-items:center; gap:9px;
  background:var(--surface); border:1.5px solid var(--line-strong); border-radius:999px;
  padding:11px 16px;
}
.search-field svg{ width:16px; height:16px; stroke:var(--ink-faint); flex:none; }
.search-field input{
  border:none; outline:none; background:none; color:var(--ink); font-size:15px; width:100%;
  font-family:inherit;
}
.search-field input::placeholder{ color:var(--ink-faint); }

/* ============ HOME ============ */
.hero{
  position:relative; overflow:hidden; border-bottom:1px solid var(--line);
}
@keyframes shimmer{ 0%{ background-position:200% 0; } 100%{ background-position:-200% 0; } }
.shimmer-bg{
  background-image:linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%);
  background-size:220% 100%; animation:shimmer 1.8s ease-in-out infinite;
}
.hero-cover{ height:0; padding-bottom:34%; max-height:230px; position:relative; background:var(--surface-2); }
.hero-cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.hero-cover::after{ content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(16,29,25,0) 45%, rgba(16,29,25,.55) 100%); }

.hero-carousel{ height:0; padding-bottom:58%; max-height:480px; position:relative; background:var(--surface-2); cursor:pointer; }
.hero-slide{ position:absolute; inset:0; opacity:0; transition:opacity .9s ease; }
.hero-slide.active{ opacity:1; }
.hero-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
.hero-carousel::after{ content:''; position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(to bottom, rgba(16,29,25,.05) 0%, rgba(16,29,25,.10) 45%, rgba(16,29,25,.72) 100%); }
.hero-welcome{
  position:absolute; left:20px; right:20px; bottom:38px; z-index:2; color:#fff;
  display:flex; align-items:center; gap:13px;
  background:rgba(16,24,15,.42); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.35); border-radius:16px; padding:11px 18px;
  width:fit-content; max-width:calc(100% - 4px); box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.hero-welcome img{ width:44px; height:44px; object-fit:contain; flex:none; }
.hero-welcome-text{ min-width:0; }
.hero-greet{ font-family:Georgia,'PT Serif',serif; font-style:italic; font-size:clamp(19px,3.6vw,27px); line-height:1.15; text-shadow:0 2px 10px rgba(0,0,0,.45); text-wrap:balance; }
.hero-greet .brand-hl{ color:var(--teal); }
.hero-current-name{ font-size:12.5px; color:rgba(255,255,255,.85); margin-top:3px; text-shadow:0 1px 6px rgba(0,0,0,.4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero-dots{ position:absolute; bottom:12px; left:0; right:0; z-index:2; display:flex; justify-content:center; gap:6px; pointer-events:none; }
.hero-dot{ width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.4); transition:width .2s, background .2s; }
.hero-dot.active{ width:15px; border-radius:3px; background:#fff; }
.hero-meta{
  max-width:1180px; margin:0 auto; padding:16px 18px 18px;
  display:flex; flex-wrap:wrap; gap:8px 20px; font-size:13px; color:var(--ink-soft);
}
.hero-meta span{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.hero-meta a{ color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line-strong); }
.hero-meta a:hover{ color:var(--teal-deep); border-color:var(--teal); }
.phone-label{ color:var(--ink-faint); font-weight:600; }

.service-banner{
  display:flex; align-items:center; justify-content:center; gap:14px;
  background:var(--surface); padding:9px 16px; text-align:center;
}
.service-banner .sb-line{ flex:0 1 56px; height:1px; background:linear-gradient(to right, transparent, var(--gold)); }
.service-banner .sb-line.r{ background:linear-gradient(to left, transparent, var(--gold)); }
.service-banner-text{
  font-family:Georgia,'PT Serif',serif; font-style:italic; font-weight:600;
  font-size:13.5px; letter-spacing:.02em; color:var(--gold); white-space:nowrap;
}


.section{ padding:22px 18px 4px; max-width:1180px; margin:0 auto; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
.section-title{ font-family:Georgia,'PT Serif',serif; font-size:22px; }
.section-title .tag{ font-size:14px; color:var(--ink-faint); font-family:'Menu UI','Segoe UI',sans-serif; }

/* horizontal rows (popular / new) */
.hscroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 18px 18px; scroll-snap-type:x proximity; scrollbar-width:none; }
.hscroll::-webkit-scrollbar{ display:none; }
.hscroll .pcard{ flex:0 0 152px; scroll-snap-align:start; }

/* category grid */
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;
  padding:0 18px 8px;
}
.cat-tile{
  position:relative; border-radius:16px; overflow:hidden; cursor:pointer; border:1px solid var(--line);
  background:var(--surface-2); aspect-ratio:4/3;
  transition:transform .15s ease, box-shadow .15s ease;
}
.cat-tile:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
.cat-tile:active{ transform:scale(.97); }
.cat-tile.cat-red{ border:2.5px solid #C0392B; }
.cat-tile img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.cat-tile .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--ink-faint); background:var(--surface-2); }
.cat-tile::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(16,20,14,.72) 0%, rgba(16,20,14,0) 55%); }
.cat-tile .lbl{ position:absolute; left:10px; right:10px; bottom:9px; z-index:1; display:flex; align-items:flex-end; justify-content:space-between; gap:6px; }
.cat-tile .lbl-name{ color:#fff; font-size:13.5px; font-weight:600; line-height:1.25; text-shadow:0 1px 4px rgba(0,0,0,.5); }
.cat-tile .lbl-count{ color:#fff; font-size:10.5px; font-weight:700; background:rgba(255,255,255,.18); backdrop-filter:blur(6px); padding:2px 7px; border-radius:20px; white-space:nowrap; flex:none; }

/* contacts */
.contacts{
  max-width:1180px; margin:26px auto 0; padding:16px 18px 34px;
  display:flex; flex-wrap:wrap; gap:10px;
}
.contact-chip{
  display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:9px 15px; font-size:13px;
}
.contact-chip:hover{ border-color:var(--teal); color:var(--teal-deep); }
.contact-chip svg{ width:14px; height:14px; }

/* ============ ITEM CARDS ============ */
.pgrid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(158px,1fr)); gap:14px;
  padding:0 18px 30px; max-width:1180px; margin:0 auto;
}
.pcard{
  cursor:pointer; border-radius:16px; overflow:hidden; background:var(--surface);
  border:1px solid var(--line); box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
  display:flex; flex-direction:column;
}
.pcard:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); }
.pcard:active{ transform:scale(.97); }
.pcard-img{ position:relative; aspect-ratio:1/1; background:var(--surface-2); overflow:hidden; }
.pcard-img img{ width:100%; height:100%; object-fit:cover; }
.pcard-img .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ink-faint); }
.pcard-badge{
  position:absolute; top:8px; left:8px; font-size:9.5px; font-weight:700; letter-spacing:.03em;
  text-transform:uppercase; padding:3px 8px; border-radius:20px; color:#fff;
}
.pcard-badge.new{ background:var(--teal-deep); }
.pcard-badge.pop{ background:var(--clay); }
.pcard-body{ padding:10px 11px 12px; display:flex; flex-direction:column; gap:5px; flex:1; }
.pcard-name{ font-size:13px; font-weight:600; line-height:1.35; color:var(--ink); }
.pcard-price{ margin-top:auto; font-variant-numeric:tabular-nums; font-weight:700; font-size:13.5px; color:var(--teal-deep); }
.pcard-price .price-sum{ font-weight:400; color:var(--ink-faint); font-size:11px; }

/* ============ DETAIL MODAL ============ */
.modal-scrim{
  position:fixed; inset:0; background:var(--scrim); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.modal-scrim.open{ opacity:1; pointer-events:auto; }
@media (min-width:640px){ .modal-scrim{ align-items:center; padding:24px; } }
.modal-card{
  background:var(--surface); width:100%; max-width:520px; max-height:90vh;
  border-radius:22px 22px 0 0; overflow:hidden; display:flex; flex-direction:column;
  transform:translateY(24px); transition:transform .22s cubic-bezier(.2,.7,.3,1);
  box-shadow:var(--shadow-lg);
}
@media (min-width:640px){ .modal-card{ border-radius:22px; transform:scale(.96); } }
.modal-scrim.open .modal-card{ transform:none; }
.modal-scroll{ overflow-y:auto; }
.modal-img{ aspect-ratio:4/3; background:var(--surface-2); position:relative; flex:none; }
.modal-img img{ width:100%; height:100%; object-fit:cover; }
.modal-img .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:44px; color:var(--ink-faint); }
.modal-close{
  position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%;
  background:rgba(16,20,14,.55); backdrop-filter:blur(6px); border:none; color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.modal-body{ padding:18px 20px 24px; }
.modal-badges{ display:flex; gap:7px; margin-bottom:10px; }
.modal-badge{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:20px; color:#fff; }
.modal-badge.new{ background:var(--teal-deep); }
.modal-badge.pop{ background:var(--clay); }
.modal-cat{ font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); font-weight:600; margin-bottom:6px; }
.modal-name{ font-family:Georgia,'PT Serif',serif; font-size:24px; line-height:1.25; margin-bottom:10px; text-wrap:balance; }
.modal-price{ font-variant-numeric:tabular-nums; font-weight:700; font-size:21px; color:var(--teal-deep); margin-bottom:14px; }
.modal-price .price-sum{ font-weight:400; color:var(--ink-faint); font-size:14px; }
.modal-desc{ font-size:14px; color:var(--ink-soft); line-height:1.7; padding-top:12px; border-top:1px solid var(--line); }

/* ============ SEARCH VIEW ============ */
.empty-state{ text-align:center; color:var(--ink-faint); padding:70px 20px; font-size:15px; }
.empty-state .ico{ font-size:38px; margin-bottom:12px; display:block; }

.offline-banner{ display:none; background:var(--clay); color:#fff; text-align:center; font-size:12.5px; padding:6px; }
.offline-banner.show{ display:block; }

.fade-in{ animation:fadeIn .25s ease both; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner"><span id="offlineBannerLabel">Internet aloqasi yo&#39;q — oxirgi saqlangan menyu ko&#39;rsatilmoqda</span></div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" id="brand"></div>
    <div class="topbar-spacer"></div>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="uz">UZ</button>
      <button data-lang="ru">RU</button>
      <button data-lang="en">EN</button>
    </div>
    <button class="icon-btn" id="searchToggle" aria-label="Qidirish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>
  <div class="service-banner" id="serviceBanner">
    <span class="sb-line"></span>
    <span class="service-banner-text" id="serviceBannerLabel"></span>
    <span class="sb-line r"></span>
  </div>
</div>

<!-- HOME -->
<div id="view-home" class="wrap"></div>

<!-- CATEGORY -->
<div id="view-category" class="wrap hide">
  <div class="subbar">
    <button class="back-btn" id="catBack">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="catBackLabel">Menyu</span>
    </button>
    <div class="subbar-title serif" id="catTitle"></div>
    <div class="subbar-count" id="catCount"></div>
  </div>
  <div class="catnav" id="catNav"></div>
  <div class="pgrid" id="catGrid"></div>
</div>

<!-- SEARCH -->
<div id="view-search" class="wrap hide">
  <div class="subbar">
    <button class="back-btn" id="searchBack">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span id="searchBackLabel">Orqaga</span>
    </button>
  </div>
  <div class="search-row">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Taom qidirish..." autocomplete="off">
    </div>
  </div>
  <div class="pgrid" id="searchGrid"></div>
  <div class="empty-state" id="searchEmpty"><span class="ico">🔍</span><span id="searchEmptyLabel">Taom nomini kiriting</span></div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-scrim" id="modal">
  <div class="modal-card">
    <div class="modal-scroll">
      <div class="modal-img" id="modalImgWrap">
        <button class="modal-close" id="modalClose" aria-label="Yopish">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('menu-data').textContent);
  const R = DATA.restaurant;

  /* ---------- til (uz/ru/en) ---------- */
  let LANG = localStorage.getItem('menuLang') || 'uz';
  const UI = {
    uz: {
      welcome: "Xush kelibsiz, ", open: "Ochiq", closed: "Yopiq", maps: "Xaritada ko’rish",
      popular: "Sevimli taomlar", newSection: "Yangi taomlar", sections: "Bo’limlar",
      dishCount: n => n + " ta taom", menu: "Menyu", back: "Orqaga",
      searchPlaceholder: "Taom qidirish...", searchHint: "Taom nomini kiriting", notFound: "Hech narsa topilmadi",
      badgeNew: "Yangi", badgePop: "Sevimli", offline: "Internet aloqasi yo’q — oxirgi saqlangan menyu ko’rsatilmoqda",
      sum: " so’m", tableBooking: "Stol bron", takeaway: "Saboy",
      serviceCharge: p => `Xizmat haqqi: ${p}%`, promo: "Reklama",
    },
    ru: {
      welcome: "Добро пожаловать, ", open: "Открыто", closed: "Закрыто", maps: "Смотреть на карте",
      popular: "Популярные блюда", newSection: "Новые блюда", sections: "Разделы",
      dishCount: n => n + " блюд", menu: "Меню", back: "Назад",
      searchPlaceholder: "Поиск блюда...", searchHint: "Введите название блюда", notFound: "Ничего не найдено",
      badgeNew: "Новинка", badgePop: "Хит", offline: "Нет интернета — показано последнее сохранённое меню",
      sum: " сум", tableBooking: "Бронь стола", takeaway: "Самовывоз",
      serviceCharge: p => `Плата за обслуживание: ${p}%`, promo: "Реклама",
    },
    en: {
      welcome: "Welcome to ", open: "Open", closed: "Closed", maps: "View on map",
      popular: "Popular dishes", newSection: "New dishes", sections: "Categories",
      dishCount: n => n + " dishes", menu: "Menu", back: "Back",
      searchPlaceholder: "Search dishes...", searchHint: "Type a dish name", notFound: "Nothing found",
      badgeNew: "New", badgePop: "Popular", offline: "No internet — showing last saved menu",
      sum: " so’m", tableBooking: "Table booking", takeaway: "Takeaway",
      serviceCharge: p => `Service charge: ${p}%`, promo: "Promotions",
    },
  };
  function t(){ return UI[LANG]; }
  function itemName(item){ return item['n' + LANG[0].toUpperCase() + LANG.slice(1)] || item.n; }
  function catLabelOf(cat){ return LANG === 'ru' ? cat.labelRu : LANG === 'en' ? cat.labelEn : cat.label; }
  function itemCatOf(item){ return LANG === 'ru' ? (item.catRu || item.cat) : LANG === 'en' ? (item.catEn || item.cat) : item.cat; }

  const homeEl = document.getElementById('view-home');
  const catViewEl = document.getElementById('view-category');
  const searchViewEl = document.getElementById('view-search');
  const catGridEl = document.getElementById('catGrid');
  const catTitleEl = document.getElementById('catTitle');
  const catCountEl = document.getElementById('catCount');
  const catNavEl = document.getElementById('catNav');
  const searchGridEl = document.getElementById('searchGrid');
  const searchEmptyEl = document.getElementById('searchEmpty');
  const searchInput = document.getElementById('searchInput');

  function fmt(p){ return Math.round(p).toLocaleString('ru-RU'); }
  function priceHtml(p){ return fmt(p) + '<span class="price-sum">' + t().sum + '</span>'; }

  function isOpenNow(hours){
    if(!hours) return null;
    const m = hours.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
    if(!m) return null;
    const now = new Date(), tot = now.getHours()*60 + now.getMinutes();
    const op = (+m[1])*60 + (+m[2]), cl = (+m[3])*60 + (+m[4]);
    return cl > op ? (tot >= op && tot < cl) : (tot >= op || tot < cl);
  }

  /* ---------- brand / topbar ---------- */
  function renderBrand(){
    const open = isOpenNow(R.hours);
    const brand = document.getElementById('brand');
    brand.innerHTML =
      (R.logo ? `<img src="${R.logo}" alt="">` : '') +
      `<div class="brand-text">
        <div class="brand-name">${R.name}</div>
        <div class="brand-status">${open===null?'':`<span class="status-dot ${open?'open':'closed'}"></span>${open?t().open:t().closed} · `}${R.hours}</div>
      </div>`;
  }

  /* ---------- item card ---------- */
  // e'tibor: SVG atributlari BITTA tirnoq bilan — bu butun belgi keyinroq HTML onerror="..."
  // atributi ichiga joylashtiriladi, juft tirnoq atributni muddatidan oldin yopib qo'yardi.
  const PLATE_SVG = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' width='30' height='30'><circle cx='12' cy='12' r='8.5'/><circle cx='12' cy='12' r='3.2'/></svg>";

  function cardHtml(item, catLabel){
    const badge = item.new ? `<span class="pcard-badge new">${t().badgeNew}</span>` : (item.pop ? `<span class="pcard-badge pop">${t().badgePop}</span>` : '');
    const img = item.img
      ? `<img src="${item.img}" alt="" loading="lazy" decoding="async" onload="this.parentElement.classList.remove('shimmer-bg')" onerror="const p=this.parentElement;this.remove();p.classList.remove('shimmer-bg');p.insertAdjacentHTML('afterbegin','<div class=&quot;ph&quot;>${PLATE_SVG}</div>')">`
      : `<div class="ph">${PLATE_SVG}</div>`;
    return `<div class="pcard" data-id="${item.id}">
      <div class="pcard-img shimmer-bg">${img}${badge}</div>
      <div class="pcard-body">
        <div class="pcard-name">${itemName(item)}</div>
        <div class="pcard-price">${priceHtml(item.p)}</div>
      </div>
    </div>`;
  }

  function bindCards(container, lookup){
    container.querySelectorAll('.pcard').forEach(el => {
      el.addEventListener('click', () => openDetail(lookup(el.dataset.id)));
    });
  }

  const itemIndex = {};
  DATA.categories.forEach(c => c.items.forEach(i => { itemIndex[i.id] = { ...i, cat: c.label, catRu: c.labelRu, catEn: c.labelEn }; }));

  /* ---------- home ---------- */
  function renderHome(){
    let html = '';

    const heroItems = DATA.popular.length ? DATA.popular : (R.cover ? [{img: R.cover, n: null, id: null}] : []);

    html += `<div class="hero">`;
    if(heroItems.length){
      html += `<div class="hero-carousel shimmer-bg" id="heroCarousel">`;
      heroItems.forEach((it, i) => {
        html += `<div class="hero-slide${i===0?' active':''}" data-idx="${i}">
          ${it.img ? `<img src="${it.img}" alt="" loading="${i===0?'eager':'lazy'}"${i===0?` onload="document.getElementById('heroCarousel').classList.remove('shimmer-bg')"`:''}>` : ''}
        </div>`;
      });
      html += `<div class="hero-welcome">
        <img src="icons/hero-logo.png" alt="">
        <div class="hero-welcome-text">
          <div class="hero-greet">${t().welcome}<span class="brand-hl">${R.name}</span>!</div>
          <div class="hero-current-name" id="heroCurrentName">${heroItems[0].id ? itemName(heroItems[0]) : ''}</div>
        </div>
      </div>`;
      if(heroItems.length > 1){
        html += `<div class="hero-dots" id="heroDots">${heroItems.map((_,i)=>`<span class="hero-dot${i===0?' active':''}"></span>`).join('')}</div>`;
      }
      html += `</div>`;
    }
    html += `<div class="hero-meta">
      <span>${R.hours}</span>
      <span><b class="phone-label">${t().tableBooking}:</b> <a href="tel:${R.phone.replace(/\s/g,'')}">${R.phone}</a></span>
      <span><b class="phone-label">${t().takeaway}:</b> <a href="tel:${R.phone2.replace(/\s/g,'')}">${R.phone2}</a></span>
      <span><a href="${R.maps}" target="_blank" rel="noopener">${t().maps}</a></span>
    </div></div>`;

    if(DATA.popular.length){
      html += `<div class="section"><div class="section-head"><span class="section-title">${t().popular} <span class="tag">${DATA.popular.length}</span></span></div></div>`;
      html += `<div class="hscroll" data-role="popular">${DATA.popular.map(i => cardHtml(i)).join('')}</div>`;
    }
    if(DATA.newItems.length){
      html += `<div class="section"><div class="section-head"><span class="section-title">${t().newSection} <span class="tag">${DATA.newItems.length}</span></span></div></div>`;
      html += `<div class="hscroll" data-role="new">${DATA.newItems.map(i => cardHtml(i)).join('')}</div>`;
    }

    html += `<div class="section"><div class="section-head"><span class="section-title">${t().sections} <span class="tag">${DATA.categories.length}</span></span></div></div>`;
    html += `<div class="cat-grid">`;
    DATA.categories.forEach(c => {
      const img = c.image
        ? `<img src="${c.image}" alt="" loading="lazy" decoding="async" onload="this.parentElement.classList.remove('shimmer-bg')" onerror="const p=this.parentElement;this.remove();p.classList.remove('shimmer-bg');p.insertAdjacentHTML('afterbegin','<div class=&quot;ph&quot;>${PLATE_SVG}</div>')">`
        : `<div class="ph">${PLATE_SVG}</div>`;
      html += `<div class="cat-tile shimmer-bg${c.redFrame ? ' cat-red' : ''}" data-id="${c.id}">
        ${img}
        <div class="lbl"><span class="lbl-name">${catLabelOf(c)}</span><span class="lbl-count">${c.items.length}</span></div>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="contacts">`;
    html += `<a class="contact-chip" href="tel:${R.phone.replace(/\s/g,'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${t().tableBooking}: ${R.phone}</a>`;
    html += `<a class="contact-chip" href="tel:${R.phone2.replace(/\s/g,'')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${t().takeaway}: ${R.phone2}</a>`;
    html += `<a class="contact-chip" href="${R.maps}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${R.address}</a>`;
    html += `</div>`;

    homeEl.innerHTML = html;

    homeEl.querySelectorAll('.hscroll .pcard').forEach(el => {
      el.addEventListener('click', () => openDetail(itemIndex[el.dataset.id]));
    });
    homeEl.querySelectorAll('.cat-tile').forEach(el => {
      el.addEventListener('click', () => openCategory(el.dataset.id));
    });
    homeEl.querySelectorAll('.hscroll[data-role]').forEach(initAutoScroll);

    initHeroCarousel(heroItems);
  }

  /* ---------- "Sevimli"/"Yangi" qatorlari o'z-o'zidan aylanadi ---------- */
  const autoScrollTimers = new WeakMap();
  function initAutoScroll(el){
    const old = autoScrollTimers.get(el);
    if(old) clearInterval(old);
    const cards = el.querySelectorAll('.pcard');
    if(cards.length < 2) return;

    let paused = false;
    let resumeTimer = null;
    const pauseAWhile = () => {
      paused = true;
      clearTimeout(resumeTimer);
      resumeTimer = setTimeout(() => { paused = false; }, 4000);
    };
    el.addEventListener('pointerdown', pauseAWhile, {passive:true});
    el.addEventListener('wheel', pauseAWhile, {passive:true});

    const step = cards[0].getBoundingClientRect().width + 12; // karta kengligi + gap
    const timer = setInterval(() => {
      if(paused) return;
      const maxScroll = el.scrollWidth - el.clientWidth;
      if(maxScroll <= 1) return;
      if(el.scrollLeft >= maxScroll - 2){
        el.scrollTo({left:0, behavior:'smooth'});
      } else {
        el.scrollBy({left:step, behavior:'smooth'});
      }
    }, 2600);
    autoScrollTimers.set(el, timer);
  }

  /* ---------- hero carousel ---------- */
  let heroTimer = null;
  function initHeroCarousel(heroItems){
    clearInterval(heroTimer);
    if(!heroItems.length) return;
    const carousel = document.getElementById('heroCarousel');
    const slides = carousel.querySelectorAll('.hero-slide');
    const dots = carousel.querySelectorAll('.hero-dot');
    const nameEl = document.getElementById('heroCurrentName');
    let idx = 0;

    function show(i){
      idx = i;
      slides.forEach((s,j) => s.classList.toggle('active', j===i));
      dots.forEach((d,j) => d.classList.toggle('active', j===i));
      if(nameEl) nameEl.textContent = heroItems[i].id ? itemName(heroItems[i]) : '';
    }

    carousel.addEventListener('click', () => {
      const item = heroItems[idx];
      if(item && item.id) openDetail(itemIndex[item.id]);
    });

    if(heroItems.length > 1){
      heroTimer = setInterval(() => show((idx+1) % heroItems.length), 4200);
    }
  }

  /* ---------- category ---------- */
  let currentCatId = null;

  function renderCatNav(activeId){
    catNavEl.innerHTML = DATA.categories.map(c =>
      `<button class="${c.id===activeId?'active':''}${c.redFrame?' cat-red':''}" data-id="${c.id}">${catLabelOf(c)}</button>`
    ).join('');
    catNavEl.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => openCategory(btn.dataset.id));
    });
    const activeBtn = catNavEl.querySelector('button.active');
    if(activeBtn) activeBtn.scrollIntoView({block:'nearest', inline:'center'});
  }

  function openCategory(id){
    const cat = DATA.categories.find(c => c.id === id);
    if(!cat) return;
    currentCatId = id;
    catTitleEl.textContent = catLabelOf(cat);
    catCountEl.textContent = t().dishCount(cat.items.length);
    renderCatNav(id);
    catGridEl.innerHTML = cat.items.map(i => cardHtml(i)).join('');
    bindCards(catGridEl, iid => itemIndex[iid]);
    showView('category');
  }

  /* ---------- search ---------- */
  const allItems = Object.values(itemIndex);
  let lastSearchQuery = '';
  function runSearch(q){
    lastSearchQuery = q;
    q = q.trim().toLowerCase();
    if(!q){
      searchGridEl.innerHTML = '';
      searchEmptyEl.innerHTML = `<span class="ico">\u{1F50D}</span><span>${t().searchHint}</span>`;
      searchEmptyEl.classList.remove('hide');
      return;
    }
    const matches = allItems.filter(i =>
      i.n.toLowerCase().includes(q) || i.nUz.toLowerCase().includes(q) ||
      i.nRu.toLowerCase().includes(q) || i.nEn.toLowerCase().includes(q)
    );
    if(!matches.length){
      searchGridEl.innerHTML = '';
      searchEmptyEl.innerHTML = `<span class="ico">\u{1F614}</span><span>${t().notFound}</span>`;
      searchEmptyEl.classList.remove('hide');
      return;
    }
    searchEmptyEl.classList.add('hide');
    searchGridEl.innerHTML = matches.map(i => cardHtml(i)).join('');
    bindCards(searchGridEl, iid => itemIndex[iid]);
  }
  searchInput.addEventListener('input', () => runSearch(searchInput.value));

  /* ---------- detail modal ---------- */
  const modal = document.getElementById('modal');
  const modalImgWrap = document.getElementById('modalImgWrap');
  const modalBody = document.getElementById('modalBody');
  let currentDetailItem = null;

  function openDetail(item){
    if(!item) return;
    currentDetailItem = item;
    modalImgWrap.className = 'modal-img shimmer-bg';
    modalImgWrap.innerHTML = document.getElementById('modalClose').outerHTML +
      (item.img
        ? `<img src="${item.img}" alt="" onload="this.parentElement.classList.remove('shimmer-bg')" onerror="const p=this.parentElement;this.remove();p.classList.remove('shimmer-bg');p.insertAdjacentHTML('beforeend','<div class=&quot;ph&quot;>${PLATE_SVG}</div>')">`
        : `<div class="ph">${PLATE_SVG}</div>`);
    document.getElementById('modalClose').addEventListener('click', closeDetail);

    const badges = [
      item.new ? `<span class="modal-badge new">${t().badgeNew}</span>` : '',
      item.pop ? `<span class="modal-badge pop">${t().badgePop}</span>` : '',
    ].filter(Boolean).join('');

    modalBody.innerHTML = `
      ${badges ? `<div class="modal-badges">${badges}</div>` : ''}
      <div class="modal-cat">${itemCatOf(item) || ''}</div>
      <div class="modal-name serif">${itemName(item)}</div>
      <div class="modal-price">${priceHtml(item.p)}</div>
      ${item.desc ? `<div class="modal-desc">${item.desc}</div>` : ''}
    `;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeDetail(){
    modal.classList.remove('open');
    document.body.style.overflow = '';
  }
  modal.addEventListener('click', e => { if(e.target === modal) closeDetail(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetail(); });

  /* ---------- view switching ---------- */
  function showView(name){
    homeEl.classList.toggle('hide', name !== 'home');
    catViewEl.classList.toggle('hide', name !== 'category');
    searchViewEl.classList.toggle('hide', name !== 'search');
    const active = name === 'home' ? homeEl : (name === 'category' ? catViewEl : searchViewEl);
    active.classList.remove('fade-in'); void active.offsetWidth; active.classList.add('fade-in');
    window.scrollTo(0,0);
  }
  document.getElementById('catBack').addEventListener('click', () => showView('home'));
  document.getElementById('searchBack').addEventListener('click', () => showView('home'));
  document.getElementById('searchToggle').addEventListener('click', () => {
    showView('search');
    runSearch('');
    setTimeout(() => searchInput.focus(), 100);
  });

  /* ---------- offline banner ---------- */
  const banner = document.getElementById('offlineBanner');
  function updateOnline(){ banner.classList.toggle('show', !navigator.onLine); }
  window.addEventListener('online', updateOnline);
  window.addEventListener('offline', updateOnline);
  updateOnline();

  /* ---------- til almashtirish ---------- */
  function applyStaticText(){
    document.documentElement.lang = LANG;
    document.getElementById('catBackLabel').textContent = t().menu;
    document.getElementById('searchBackLabel').textContent = t().back;
    document.getElementById('offlineBannerLabel').textContent = t().offline;
    document.getElementById('serviceBannerLabel').textContent = t().serviceCharge(DATA.serviceCharge);
    searchInput.placeholder = t().searchPlaceholder;
    document.querySelectorAll('#langSwitch button').forEach(b => b.classList.toggle('active', b.dataset.lang === LANG));
  }

  function refreshCurrentView(){
    renderBrand();
    renderHome();
    if(currentCatId) openCategory(currentCatId);
    if(!searchViewEl.classList.contains('hide')) runSearch(lastSearchQuery);
    if(modal.classList.contains('open') && currentDetailItem) openDetail(currentDetailItem);
  }

  document.querySelectorAll('#langSwitch button').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.lang === LANG) return;
      LANG = btn.dataset.lang;
      localStorage.setItem('menuLang', LANG);
      applyStaticText();
      refreshCurrentView();
    });
  });
  applyStaticText();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  /* ---------- barcha suratlarni fonda oldindan yuklab, keshga solish ----------
     Shunda internet keyinroq uzilib qolsa ham hali ko'rilmagan taomlarning
     suratlari ham ko'rinadi (Service Worker ularni avtomatik keshlaydi). */
  function prefetchAllImages(){
    if(!navigator.onLine) return;
    const urls = new Set();
    if(R.logo) urls.add(R.logo);
    if(R.cover) urls.add(R.cover);
    DATA.categories.forEach(c => { if(c.image) urls.add(c.image); });
    Object.values(itemIndex).forEach(i => { if(i.img) urls.add(i.img); });
    urls.forEach(u => { fetch(u).catch(()=>{}); });
  }

  /* ---------- fonda yangilanishni tekshirish ----------
     Tablet ilovasi kun bo'yi qayta ochilmasdan tursa ham, menyu har soatda
     serverda yangilangani uchun bu yerda ham vaqti-vaqti bilan tekshirib,
     yangi versiya borligini payqasak sahifani o'zi qayta yuklaydi. */
  const BUILD_ID = DATA.buildId;
  const CHECK_INTERVAL_MS = 10 * 60 * 1000; // 10 daqiqada bir

  async function checkForUpdate(){
    if(!navigator.onLine) return;
    try{
      // e'tibor: so'rov manzilida vaqt belgisi qo'shmaymiz — aks holda har safar
      // yangi kesh yozuvi yaratilib, tablet xotirasi asta cheksiz to'lib boraveradi.
      // cache:'no-store' o'zi HTTP keshni chetlab o'tib, tarmoqdan yangisini olishga majburlaydi.
      const res = await fetch('index.html', {cache:'no-store'});
      const html = await res.text();
      const m = html.match(/"buildId":(\d+)/);
      if(!m) return;
      const latestBuildId = parseInt(m[1], 10);
      if(latestBuildId !== BUILD_ID && !modal.classList.contains('open')){
        location.reload();
      }
    }catch{ /* internet yo'q yoki server javob bermadi — indamay qolamiz */ }
  }
  setInterval(checkForUpdate, CHECK_INTERVAL_MS);

  renderBrand();
  renderHome();
  setTimeout(prefetchAllImages, 1500);
})();
</script>
</body>
</html>
