<script>
(function(){
  const raw = JSON.parse(document.getElementById('menu-data').textContent);
  const LABELS = {"Salat": "Salatlar", "1-taomlar": "Birinchi taomlar", "2-taomlar": "Ikkinchi taomlar", "Shashliklar": "Shashliklar", "Балик таомлар": "Baliq taomlari", "Assorti taomlar": "Assorti taomlar", "Бараклар": "Baraklar", "Somsa": "Somsa", "Нон чой": "Non va choy", "Сетлар": "Setlar", "Ichimlik": "Ichimliklar", "Бариста": "Barista", "Shirinliklar": "Shirinliklar", "Mevalar": "Mevalar"};
  const main = document.getElementById('main');
  const nav = document.getElementById('catnav');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');

  function slug(s){ return 'cat-' + s.split('').map(c=>c.charCodeAt(0).toString(36)).join(''); }

  raw.forEach(cat => {
    const id = slug(cat.cat);
    const label = LABELS[cat.cat] || cat.cat;

    const btn = document.createElement('button');
    btn.textContent = label;
    btn.dataset.target = id;
    btn.addEventListener('click', () => {
      document.getElementById(id).scrollIntoView({behavior:'smooth', block:'start'});
    });
    nav.appendChild(btn);

    const section = document.createElement('section');
    section.className = 'category';
    section.id = id;

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<h2 class="serif"></h2><span class="cat-count"></span>';
    head.querySelector('h2').textContent = label;
    head.querySelector('.cat-count').textContent = cat.items.length + ' ta taom';
    section.appendChild(head);

    const rule = document.createElement('hr');
    rule.className = 'cat-rule';
    section.appendChild(rule);

    const list = document.createElement('div');
    list.className = 'items';
    cat.items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.name = it.n.toLowerCase();
      const tag = it.new ? 'Yangi' : (it.pop ? 'Sevimli' : '');
      row.innerHTML =
        (it.pop || it.new ? '<span class="marker" aria-hidden="true"></span>' : '') +
        '<span class="name">' + it.n + (tag ? '<span class="tagtxt">' + tag + '</span>' : '') + '</span>' +
        '<span class="leader" aria-hidden="true"></span>' +
        '<span class="price">' + Math.round(it.p).toLocaleString('ru-RU') + '</span>';
      list.appendChild(row);
    });
    section.appendChild(list);
    main.insertBefore(section, empty);
  });

  const sections = Array.from(document.querySelectorAll('.category'));
  const navButtons = Array.from(nav.querySelectorAll('button'));

  const reveal = new IntersectionObserver(entries => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('in-view'); });
  }, {threshold:.08});
  sections.forEach(s => reveal.observe(s));

  const spy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        navButtons.forEach(b => b.classList.toggle('active', b.dataset.target === e.target.id));
      }
    });
  }, {rootMargin:'-40% 0px -55% 0px'});
  sections.forEach(s => spy.observe(s));

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let anyVisible = false;
    sections.forEach(sec => {
      let sectionHas = false;
      sec.querySelectorAll('.item').forEach(row => {
        const match = !q || row.dataset.name.includes(q);
        row.style.display = match ? '' : 'none';
        if(match) sectionHas = true;
      });
      sec.hidden = !sectionHas;
      if(sectionHas) anyVisible = true;
    });
    empty.hidden = anyVisible;
  });

  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 700);
  }, {passive:true});
  toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));

  const banner = document.getElementById('offlineBanner');
  function updateOnline(){ banner.classList.toggle('show', !navigator.onLine); }
  window.addEventListener('online', updateOnline);
  window.addEventListener('offline', updateOnline);
  updateOnline();

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
