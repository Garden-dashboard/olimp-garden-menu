<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#061710">
<meta name="color-scheme" content="dark">
<title>Olimp Garden — Menyu</title>
<meta name="description" content="Olimp Garden restoranining to'liq menyusi">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-48.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Olimp Garden">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: ixcham sarlavha + yupqa muhit bandi; ostida yopishqoq bo'limlar qatori; butun menyu bitta oqimda (bo'lim = bo'lim sarlavhasi + kartalar to'ri);
   pastda «Tanlovim» paneli; taom oynasi telefonda pastdan, planshetda o'ngdan chiqadi. Faqat yorug' rejim (Android "force dark" menyuni buzgan edi). */
:root {
  /* CRM'dagi "oynasimon" uslub: to'q yashil + oltin, fon — restoranning o'z surati */
  --bg: #061710;
  --glass: rgba(10, 24, 16, .56);
  --glass-hi: rgba(10, 24, 16, .72);
  --sheen-a: rgba(255, 255, 255, .07);
  --sheen-b: rgba(255, 255, 255, .015);
  --edge: rgba(255, 255, 255, .10);
  --lip: rgba(0, 0, 0, .40);
  --ink: #F4F0E5;
  --muted: #B3C2B4;
  --line: rgba(244, 240, 229, .14);
  --gold: #C9A85B;
  --gold-hi: #E6CE8C;
  --gold-ink: #241A06;
  --green: #7FD8A6;
  --shadow: 0 18px 44px rgba(0, 0, 0, .42);
  --scrim: rgba(3, 10, 6, .55);
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
body { background: var(--bg); color: var(--ink); font: 500 15px/1.5 var(--f-body); }
button { font: inherit; color: inherit; touch-action: manipulation; }
button, .card, .chip { -webkit-user-select: none; user-select: none; }
img, video { display: block; max-width: 100%; }
img { -webkit-touch-callout: none; -webkit-user-drag: none; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* sarlavha */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
.bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 50%; background: var(--gold); padding: 5px; object-fit: contain; }
.brand b { font: 600 20px/1.1 var(--f-display); display: block; }
.brand small { color: var(--muted); font-size: 12px; }
.svc { background: var(--gold); color: #24180A; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 7px 12px; white-space: nowrap; }
.langs { display: flex; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button { border: 0; background: none; min-width: 40px; min-height: 36px; border-radius: 999px; font-weight: 700; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
@media (max-width: 560px) { .svc { display: none; } .brand small { display: none; } }

/* bo'limlar qatori + siljiydigan fon */
.cats { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 10px; touch-action: pan-x; }
.cats::-webkit-scrollbar { display: none; }
.cats .pill { position: absolute; left: 0; top: 4px; height: 44px; width: 0; border-radius: 999px; background: var(--gold); pointer-events: none; }
.chip { position: relative; flex: none; border: 0; background: none; min-height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .15s ease-out; }
.chip[aria-current="true"] { color: var(--gold-ink); }
.topline { height: 1px; background: var(--line); }

/* muhit bandi */
.hero { position: relative; margin-top: 12px; border-radius: 22px; overflow: hidden; background: var(--gold); height: clamp(190px, 30vw, 340px); }
.hero video, .hero img { width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,24,16,.72), rgba(10,24,16,.1) 70%); }
.hero .txt { position: absolute; z-index: 1; left: 0; bottom: 0; padding: 22px 24px; color: var(--gold-ink); }
.hero h1 { font: 600 clamp(28px, 4.4vw, 46px)/1.05 var(--f-display); margin: 0 0 6px; text-wrap: balance; }
.hero p { margin: 0 0 14px; font-size: 14px; opacity: .88; }
.hero a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--gold-ink); color: var(--gold); font-weight: 700; text-decoration: none; }

/* bo'limlar */
main { padding-bottom: 120px; }
.sec { scroll-margin-top: 128px; padding-top: 26px; }
.sec h2 { font: 600 26px/1.15 var(--f-display); margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; }
.sec h2 span { font: 600 13px var(--f-body); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .sec h2 { font-size: 22px; } }
.card { position: relative; display: flex; flex-direction: column; text-align: left; border: 1px solid var(--line); background: var(--glass); border-radius: 16px; overflow: hidden; padding: 0; cursor: pointer; transition: transform .12s ease-out; }
.card:active { transform: scale(.97); }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: rgba(255,255,255,.06); }
.card .b { padding: 10px 12px 12px; display: grid; gap: 4px; flex: 1; align-content: start; }
.card .n { font-weight: 700; font-size: 14.5px; line-height: 1.3; }
.card .p { font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.tag { position: absolute; top: 8px; left: 8px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--glass); color: var(--ink); }
.tag.new { background: var(--gold); color: #fff; }
.mark { position: absolute; top: 8px; right: 8px; min-width: 30px; height: 30px; padding: 0 9px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-weight: 700; font-size: 13px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
@media (hover: hover) and (pointer: fine) { .card:hover { border-color: var(--gold); } }

/* yangi taomlar: katta gorizontal qator */
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 34%); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 4px; }
.row::-webkit-scrollbar { display: none; }
.row .card { scroll-snap-align: start; }
.row .card img { aspect-ratio: 16 / 11; }
@media (max-width: 560px) { .row { grid-auto-columns: 78%; } }

/* kontaktlar */
.foot { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 34px 10px; border-top: 1px solid var(--line); margin-top: 34px; color: var(--muted); font-size: 14px; }
.foot a, .foot span { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.foot svg { width: 15px; height: 15px; }

/* tanlov paneli */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.dock button { pointer-events: auto; width: 100%; max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 20px; border: 0; border-radius: 16px; background: var(--ink); color: var(--gold-ink); font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 0 12px 30px rgba(14,22,18,.28); font-variant-numeric: tabular-nums; transform: translateY(140%); transition: transform .32s cubic-bezier(.32,.72,0,1); }
.dock.on button { transform: none; }
.dock button:active { transform: scale(.98); }

/* raqam aylanishi (Number stepper) */
.roll { display: inline-grid; overflow: hidden; vertical-align: bottom; }
.roll > span { grid-area: 1 / 1; will-change: transform; }

/* oyna: telefonda pastdan, planshetda o'ngdan */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); opacity: 0; }
.sheet { position: fixed; z-index: 51; background: var(--bg); display: flex; flex-direction: column; outline: none; box-shadow: 0 20px 60px rgba(0,0,0,.3); will-change: transform; }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; padding: 0 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
.grab { touch-action: none; padding: 10px 0 12px; display: grid; place-items: center; cursor: grab; flex: none; }
.grab i { width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
@media (max-width: 899px) { .sheet { left: 0; right: 0; bottom: -40px; padding-bottom: 40px; max-height: calc(92% + 40px); border-radius: 22px 22px 0 0; } }
@media (min-width: 900px) { .sheet { top: 0; bottom: 0; right: -40px; padding-right: 40px; width: calc(min(520px, 46vw) + 40px); } .grab { display: none; } .sheet .body { padding-top: 20px; } }
.x { position: absolute; top: 14px; right: 14px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
@media (min-width: 900px) { .x { right: 54px; } }
.x svg { width: 18px; height: 18px; }
.dish-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px; background: rgba(255,255,255,.06); touch-action: none; }
.sheet h3 { font: 600 26px/1.15 var(--f-display); margin: 16px 0 6px; text-wrap: balance; }
.dp { font-size: 20px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
.dd { color: var(--muted); margin: 0 0 18px; max-width: 60ch; }
.acts { display: flex; gap: 10px; align-items: center; }
.step { display: flex; align-items: center; border: 1px solid var(--line); background: var(--glass); border-radius: 14px; flex: none; }
.step button { width: 46px; height: 50px; border: 0; background: none; font-size: 22px; cursor: pointer; }
.step .q { min-width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.go { flex: 1; min-height: 52px; border: 0; border-radius: 14px; background: var(--gold); color: var(--gold-ink); font-weight: 700; cursor: pointer; transition: transform .12s ease-out; }
.go:active { transform: scale(.98); }
.go.del { background: var(--glass); color: var(--ink); border: 1px solid var(--line); }

/* tanlov ro'yxati */
.lr { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lr img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; }
.lr .n { font-weight: 700; font-size: 14px; line-height: 1.3; }
.lr .s { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lr .step button { width: 40px; height: 40px; font-size: 18px; }
.sum { display: grid; gap: 6px; margin: 16px 0; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; color: var(--muted); }
.sum .t { color: var(--ink); font: 600 22px var(--f-display); }
.note { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }

/* qidiruv */
.sfield { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; margin: 4px 0 16px; }
.sfield input { flex: 1; min-height: 50px; border: 0; outline: 0; background: none; font: 600 16px var(--f-body); color: var(--ink); }
.sfield svg { width: 18px; height: 18px; color: var(--muted); }
.sres { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (prefers-reduced-motion: reduce) { .card, .go, .dock button { transition-duration: .01ms; } }

/* ===== shisha qatlami ===== */
html { background: var(--bg); }
body { background: transparent; }
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(4,14,9,.55), rgba(4,14,9,.35) 40%, rgba(4,14,9,.7)), url("media/fon.jpg") center / cover no-repeat, var(--bg); }
.top { background: rgba(6, 18, 12, .55); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
  box-shadow: inset 0 -1px 0 var(--edge); }
body::before { background: rgba(6, 18, 12, .55); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
.topline { display: none; }
.card, .langs, .iconbtn, .foot a, .foot span, .step, .sfield, .row .card {
  background-color: var(--glass);
  background-image: linear-gradient(118deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 18%), linear-gradient(158deg, var(--sheen-a), var(--sheen-b) 40%, rgba(255,255,255,0) 72%);
  border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--lip);
}
.card { box-shadow: inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--lip), 0 10px 26px rgba(0,0,0,.25); }
.card .p, .dp { color: var(--gold-hi); }
.card .n { color: var(--ink); }
.tag { background: rgba(6,18,12,.78); color: var(--ink); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.tag.new { background: var(--gold); color: var(--gold-ink); }
.mark { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.brand img { background: none; padding: 0; }
.brand b { color: var(--ink); }
.svc { background: var(--gold); color: var(--gold-ink); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); }
.langs button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.cats .pill { background: var(--gold); background-image: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 60%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(0,0,0,.3); }
.chip { color: var(--muted); }
.chip[aria-current="true"] { color: var(--gold-ink); }
.hero { background: #0b1a12; box-shadow: inset 0 1px 0 var(--edge), var(--shadow); border: 1px solid var(--line); }
.hero a { background: var(--gold); color: var(--gold-ink); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); }
.sec h2 { color: var(--ink); text-shadow: 0 2px 14px rgba(0,0,0,.45); }
.dock button { background: var(--gold); color: var(--gold-ink); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 14px 34px rgba(0,0,0,.45); }
.sheet { background-color: var(--glass-hi);
  background-image: linear-gradient(158deg, var(--sheen-a), var(--sheen-b) 40%, rgba(255,255,255,0) 72%);
  -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%);
  box-shadow: inset 0 1px 0 var(--edge), 0 24px 70px rgba(0,0,0,.5); }
.grab i { background: rgba(255,255,255,.3); }
.x { background: rgba(6,18,12,.7); color: var(--ink); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 var(--edge); }
.go { background: var(--gold); color: var(--gold-ink); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
.go.del { background: var(--glass); background-image: none; color: var(--ink); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--edge); }
.step button { color: var(--ink); }
.sum .t { color: var(--gold-hi); }
.foot { border-top-color: var(--line); }
.hero .txt { color: var(--ink); }
.hero p { color: var(--ink); }
.foot a, .foot span { color: var(--ink); }
.empty, .note { color: var(--muted); }
.lr { border-bottom-color: var(--line); }
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) { .top, .sheet { background-color: rgba(8,20,13,.94); } }

/* bo'lim-bo'lim ko'rinish */
.catrow { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
.catrow .cats { flex: 1; min-width: 0; padding-bottom: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; gap: 10px; } }
.tile { position: relative; aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--glass); padding: 0; cursor: pointer;
  transition: transform .12s ease-out; box-shadow: inset 0 1px 0 var(--edge), 0 10px 26px rgba(0,0,0,.28); }
.tile:active { transform: scale(.97); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .lb { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 14px;
  background: rgba(6,18,12,.62); -webkit-backdrop-filter: blur(12px) saturate(150%); backdrop-filter: blur(12px) saturate(150%); box-shadow: inset 0 1px 0 var(--edge); }
.tile .lb b { font: 600 17px/1.2 var(--f-display); color: var(--ink); }
.tile .lb small { color: var(--gold-hi); font-weight: 700; font-size: 12.5px; }
@media (hover: hover) and (pointer: fine) { .tile:hover { border-color: var(--gold); } }
#cgrid { touch-action: pan-y; }

/* «Yangi taomlar» yuguruvchi qatori */
.marq { overflow: hidden; touch-action: pan-y; margin: 0 -4px; padding: 0 4px 4px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.track { display: flex; gap: 14px; width: max-content; will-change: transform; }
.track .card { flex: none; width: clamp(230px, 27vw, 320px); }
.track .card img { aspect-ratio: 16 / 11; }
@media (max-width: 560px) { .track .card { width: 72vw; } }

/* hero 1-variant: chapda ma'lumot, o'ngda tik video o'z shaklida (kesilmaydi) */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) clamp(190px, 50%, 420px); align-items: center; gap: clamp(14px, 3vw, 36px);
  height: auto; overflow: visible; padding: clamp(14px, 2.6vw, 30px); border-radius: 24px;
  background-color: var(--glass); background-image: linear-gradient(118deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 18%), linear-gradient(158deg, var(--sheen-a), var(--sheen-b) 40%, rgba(255,255,255,0) 72%);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--edge), inset 0 -1px 0 var(--lip), var(--shadow); }
.hero::after { display: none; }
.hero .txt { position: static; padding: 0; color: var(--ink); min-width: 0; }
.hero h1 { font: 600 clamp(26px, 4.6vw, 54px)/1.04 var(--f-display); margin: 0 0 clamp(12px, 2vw, 22px); color: var(--ink); text-wrap: balance; }
.facts { list-style: none; margin: 0 0 clamp(14px, 2.4vw, 26px); padding: 0; display: grid; gap: 10px; font-size: clamp(13px, 1.6vw, 16px); color: var(--muted); }
.facts li { display: flex; align-items: center; gap: 10px; min-width: 0; }
.facts svg { width: 17px; height: 17px; flex: none; color: var(--gold-hi); }
.hero .facts a { display: inline; min-height: 0; padding: 0; border-radius: 0; background: none; box-shadow: none; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
.hero a.book { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; text-decoration: none;
  background: var(--gold); color: var(--gold-ink); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 20px rgba(0,0,0,.3); }
.vframe { width: 100%; height: auto; aspect-ratio: 9 / 16; border-radius: 20px; overflow: hidden; background: #0b1a12; border: 1px solid var(--line);
  box-shadow: inset 0 1px 0 var(--edge), 0 20px 44px rgba(0,0,0,.45); }
.vframe video { width: 100%; height: 100%; object-fit: cover; }
@media (max-width: 560px) {
  .hero { gap: 12px; padding: 14px; border-radius: 20px; }
  .vframe { border-radius: 16px; }
  .hero { grid-template-columns: minmax(0, 1fr) 56%; gap: 10px; padding: 12px; }

  // ---- prujinalar (motion-springs): {x,v,t,k,c} ----
  function run(springs, draw, done) {

  // ---- raqam aylanishi: yangi qiymat pastdan, eskisi yuqoriga (spring 260 24) ----
  function roll(el, text, dir = 1) {

  // ---- tanlov ro'yxati (planshetda 3 daqiqa bo'sh tursa tozalanadi) ----
  const pick = new Map();

  function syncPick(dir = 1) {
    const { n, s } = total();

    document.querySelectorAll('.card[data-id]').forEach(c => {
      const q = pick.get(c.dataset.id), m = c.querySelector('.mark');

    });
  }
  function setQty(id, q) { const before = pick.get(id) || 0; if (q > 0) pick.set(id, Math.min(q, 30)); else pick.delete(id); syncPick(q >= before ? 1 : -1); }

  // ---- bo'limlar qatori: faol fon cho'zilib siljiydi (Tab pill: ikki chet, ikki prujina) ----
  const A = S(0, 620, 40), B = S(0, 620, 40); let stopPill = null, active = null;
  function setActive(id, instant) {
    if (id === active) return; active = id;
    const nav = $('cats'), btn = nav.querySelector(`[data-c="${CSS.escape(id)}"]`); if (!btn) return;
    nav.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-current', b === btn ? 'true' : 'false'));
    const l = btn.offsetLeft, r = l + btn.offsetWidth;

    A.t = l; B.t = r;
    const pill = $('pill'), draw = () => { pill.style.transform = `translateX(${A.x}px)`; pill.style.width = Math.max(0, B.x - A.x) + 'px'; };
    stopPill && stopPill();
    if (instant || REDUCED) { A.x = l; B.x = r; draw(); } else stopPill = run([A, B], draw);

  }

  // ---- karta ----

  // ---- ikki ko'rinish: bosh sahifa (bo'limlar plitkasi) va bitta bo'lim ----
  let view = 'home', curCat = null;
  const nav = (st, replace) => { try { replace ? history.replaceState(st, '') : history.pushState(st, ''); } catch (e) {} };

    const hours = L().days ? r.hoursFull.replace(/^[^:]*:/, L().days + ':') : r.hoursFull;
    $('foot').innerHTML = `<a href="${esc(r.maps)}" target="_blank" rel="noopener">${pin}<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>${L().addr}</a>`

  function showHome(fromPop) {

  // ---- «Yangi taomlar»: doim sekin siljiydi; barmoq bilan ushlanadi, qo'yib yuborilsa silkitish tezligida ketib, 3 soniyadan keyin yana yuradi ----
  let marqStop = null;
  function startMarquee() {
    marqStop && marqStop();

      const c = tr.children, n = c.length / 2;
      const period = n >= 1 ? c[n].offsetLeft - c[0].offsetLeft : 0;
      if (!period) return;

      tr.style.animationDuration = Math.round(period / 34) + 's';    // ~34 px/soniya

    let t = 0;

    box.addEventListener('pointerdown', hold);

  function openCat(id, opt) {

  $('menu').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openCat(t.dataset.c); });

    const b = e.target.closest('.chip'); if (!b || b.dataset.c === curCat) return;
    const i = cats.findIndex(x => x.id === curCat), j = cats.findIndex(x => x.id === b.dataset.c);

  $('backBtn').addEventListener('click', () => { try { if (history.state && history.state.g === 'cat') { history.back(); return; } } catch (e) {} showHome(); scrollTo({ top: 0 }); });

  // bo'limlar orasida chapga-o'ngga surish (gestures: 1:1, chetda qarshilik, masofa yoki tezlik)
  function slideIn(el, from) {

    const sp = S(from * 60, 300, 30); sp.t = 0; el.style.opacity = .5;
    run([sp], () => { el.style.transform = `translateX(${sp.x}px)`; el.style.opacity = 1 - Math.min(1, Math.abs(sp.x) / 60) * .5; },
              () => { el.style.transform = ''; el.style.opacity = ''; });
  }
  (() => {
    const m = $('menu'); let d = null, moved = false;
    m.addEventListener('pointerdown', e => { if (view !== 'cat' || e.button !== 0 || e.pointerType === 'mouse') return; d = { x0: e.clientX, y0: e.clientY, lock: null, s: [] }; moved = false; });
    m.addEventListener('pointermove', e => {
      if (!d) return; const dx = e.clientX - d.x0, dy = e.clientY - d.y0;

      if (d.lock !== 'x') return;
      const i = cats.findIndex(x => x.id === curCat), edge = (dx > 0 && i === 0) || (dx < 0 && i === cats.length - 1);

    const end = () => {
      if (!d) return; const was = d.lock, x = d.x || 0, s = d.s; d = null; if (was !== 'x') return;

      const g = $('cgrid'), W = g ? g.clientWidth : 1, i = cats.findIndex(c => c.id === curCat);
      const dir = (x < -W * .25 || v < -450) ? 1 : (x > W * .25 || v > 450) ? -1 : 0, next = cats[i + dir];
      if (dir && next) openCat(next.id, { from: dir, top: true });
      else if (g) { const sp = S(x, 520, 34); sp.v = v; sp.t = 0; run([sp], () => g.style.transform = `translateX(${sp.x}px)`, () => g.style.transform = ''); }
    };
    m.addEventListener('pointerup', end); m.addEventListener('pointercancel', end);
    m.addEventListener('click', e => { if (moved) { e.stopPropagation(); moved = false; } }, true);
  })();
  document.querySelector('.langs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l;
    try { localStorage.setItem('menuLang', lang); } catch (e) {}
    $('dCount').removeAttribute('data-v'); $('dSum').removeAttribute('data-v');
    render(); if (openKind === 'dish') openDish(openId, true); else if (openKind === 'list') openList(true);
  });

  // ---- oyna (telefonda pastdan, planshetda o'ngdan) — tortib yopiladi ----
  const wide = matchMedia('(min-width:900px)');
  const sheet = $('sheet'), scrim = $('scrim');
  const P = S(1, 260, 30); let stopSheet = null, openKind = null, openId = null, lastFocus = null;
  const span = () => wide.matches ? sheet.offsetWidth - 40 : sheet.offsetHeight - 40;
  function place() { const d = P.x * span(); sheet.style.transform = wide.matches ? `translateX(${d}px)` : `translateY(${d}px)`; scrim.style.opacity = Math.max(0, 1 - P.x); }
  function show(kind, html, keep) {
    $('sBody').innerHTML = html; $('sBody').scrollTop = keep ? $('sBody').scrollTop : 0;
    if (openKind) { openKind = kind; return; }
    openKind = kind; lastFocus = document.activeElement;
    sheet.hidden = false; scrim.hidden = false; document.documentElement.style.overflow = 'hidden';
    P.x = 1; P.v = 0; P.t = 0; tune(P, 260, 2 * Math.sqrt(260));   // tugma bilan ochildi: sakrashsiz
    place(); stopSheet && stopSheet(); stopSheet = run([P], place);
    sheet.focus({ preventScroll: true });
    try { history.pushState({ g: kind }, ''); } catch (e) {}
  }
  function hide(v = 0, fromPop) {
    if (!openKind) return;
    openKind = null;
    tune(P, 260, v ? 26 : 2 * Math.sqrt(260)); P.t = 1.05; P.v = v / Math.max(1, span());
    stopSheet && stopSheet(); stopSheet = run([P], place, () => { sheet.hidden = true; scrim.hidden = true; document.documentElement.style.overflow = ''; });
    lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true });
    if (!fromPop) { try { if (history.state && ['dish', 'list', 'search'].includes(history.state.g)) history.back(); } catch (e) {} }
  }
  addEventListener('popstate', e => {
    if (openKind) { hide(0, true); return; }
    const st = e.state || {};
    if (st.g === 'cat' && st.c) openCat(st.c, { fromPop: true, top: true });
    else if (view !== 'home') { showHome(true); scrollTo({ top: 0 }); }
  });
  scrim.addEventListener('click', () => hide());
  $('xBtn').addEventListener('click', () => hide());
  addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  // tortish: 1:1, qo'yib yuborilganda masofa YOKI tezlik
  (() => {
    let d = null;
    sheet.addEventListener('pointerdown', e => {
      if (e.button !== 0 || !(e.target.closest('#grab') || e.target.closest('.dish-img'))) return;
      stopSheet && stopSheet(); d = { a: wide.matches ? e.clientX : e.clientY, from: P.x, s: [] }; sheet.setPointerCapture(e.pointerId);
    });
    sheet.addEventListener('pointermove', e => {
      if (!d) return;
      const pos = wide.matches ? e.clientX : e.clientY, raw = d.from + (pos - d.a) / span();
      P.x = raw < 0 ? raw * .2 : raw; place();
      d.s.push([pos, performance.now()]); if (d.s.length > 6) d.s.shift();
    });
    const end = () => {
      if (!d) return; const s = d.s; d = null;
      const a = s[0], b = s[s.length - 1], v = a && b && b[1] > a[1] && performance.now() - b[1] < 80 ? (b[0] - a[0]) / ((b[1] - a[1]) / 1000) : 0;
      if (P.x > .3 || v > 500) hide(Math.max(v, 0));
      else { P.t = 0; P.v = v / span(); tune(P, 520, 34); stopSheet = run([P], place); }
    };
    sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
  })();

  function openDish(id, keep) {
    const it = byId[id]; openId = id; let q = pick.get(id) || 1;
    show('dish', `<img class="dish-img" src="${esc(it.photo)}" alt="" draggable="false">
      <h3>${esc(nameOf(it))}</h3><div class="dp" id="dp"></div>${descOf(it) ? `<p class="dd">${esc(descOf(it))}</p>` : ''}
      <div class="acts"><div class="step"><button type="button" id="qm" aria-label="−">−</button><span class="q" id="qv"></span><button type="button" id="qp" aria-label="+">+</button></div>
      <button type="button" class="go" id="qa"></button></div>
      ${pick.has(id) ? `<p style="margin:12px 0 0"><button type="button" class="go del" id="qd" style="width:100%">${L().remove}</button></p>` : ''}`, keep);
    const sync = (dir) => { roll($('qv'), String(q), dir); roll($('dp'), money(q * it.price), dir);
      $('qa').textContent = pick.get(id) === q ? L().inList : L().add; };
    sync(1);
    $('qm').onclick = () => { if (q > 1) { q--; sync(-1); } };
    $('qp').onclick = () => { if (q < 30) { q++; sync(1); } };
    $('qa').onclick = () => { setQty(id, q); sync(1); setTimeout(() => hide(), 450); };
    const qd = $('qd'); if (qd) qd.onclick = () => { setQty(id, 0); hide(); };
  }
  function openList(keep) {
    const rows = [...pick.entries()];
    const { s } = total(), svc = Math.round(s * D.service / 100);
    show('list', `<h3 style="margin-top:4px">${L().list}</h3>${rows.length ? `<p class="note">${L().listNote}</p>` + rows.map(([id, q]) => { const it = byId[id];
      return `<div class="lr" data-id="${id}"><img src="${esc(thumb(it.photo))}" ${back(it.photo)} alt="" decoding="async"><div><div class="n">${esc(nameOf(it))}</div><div class="s">${q} × ${money(it.price)}</div></div>
      <div class="step"><button type="button" data-d="-1" aria-label="−">−</button><span class="q">${q}</span><button type="button" data-d="1" aria-label="+">+</button></div></div>`; }).join('')
      + `<div class="sum"><div><span>${L().subtotal}</span><span>${money(s)}</span></div><div><span>${L().service(D.service)}</span><span>${money(svc)}</span></div><div class="t"><span>${L().total}</span><span>${money(s + svc)}</span></div></div>
      <button type="button" class="go del" id="clr" style="width:100%">${L().clear}</button>` : `<p class="empty">${L().empty}</p>`}`, keep);
    $('sBody').querySelectorAll('.lr .step button').forEach(b => b.onclick = () => { const id = b.closest('.lr').dataset.id; setQty(id, (pick.get(id) || 0) + +b.dataset.d); openList(true); });
    const c = $('clr'); if (c) c.onclick = () => { pick.clear(); syncPick(-1); hide(); };
  }
  $('dockBtn').addEventListener('click', () => openList());
  $('menu').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openDish(c.dataset.id); });

  // ---- qidiruv: uch tilda ----
  $('sBtn').addEventListener('click', () => {
    show('search', `<div class="sfield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="${L().search}" placeholder="${L().search}"></div><div class="sres" id="sr"></div>`);
    const q = $('q'); setTimeout(() => q.focus(), 60);
    q.oninput = () => { const v = q.value.trim().toLowerCase();
      const m = v ? D.items.filter(i => [i.nUz, i.nRu, i.nEn].join(' ').toLowerCase().includes(v)) : [];
      $('sr').innerHTML = v && !m.length ? `<p class="empty">${L().none}</p>` : m.map(card).join(''); };
    $('sr').onclick = e => { const c = e.target.closest('.card'); if (c) openDish(c.dataset.id); };
  });

  // ---- muhit videosi: faqat Wi-Fi'da va harakat cheklanmagan bo'lsa ----
  (() => {
    const c = navigator.connection || {}, v = $('vid');
    if (c.saveData) return;                     // faqat foydalanuvchi o'zi "trafik tejash"ni yoqqan bo'lsa
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    const go = () => { if (!document.hidden && !$('hero').hidden && v.paused) v.play().catch(() => {}); };
    go();
    ['canplay', 'stalled', 'suspend', 'pause'].forEach(ev => v.addEventListener(ev, () => setTimeout(go, 400)));
    document.addEventListener('visibilitychange', go);
    setInterval(go, 4000);                       // to'xtab qolsa o'zi qayta yuradi
    ['touchend', 'click'].forEach(ev => document.addEventListener(ev, go, { passive: true }));   // iOS: birinchi tegishda
  })();

  // ---- bo'sh tursa (3 daqiqa) keyingi mehmon uchun: tanlov tozalanadi, tepaga qaytadi ----
  let idle = 0;
  const arm = () => { clearTimeout(idle); idle = setTimeout(() => { pick.clear(); syncPick(-1); hide(); showHome(); scrollTo({ top: 0 }); }, 180000); };
  ['pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(ev => addEventListener(ev, arm, { passive: true })); arm();

  // ---- ma'lumot: generator sahifaga joylagan payload (iiko + admin panel) ----
  const payload = JSON.parse(document.getElementById('garden-data').textContent);
  const ri = $('rinfo').dataset;
  const BUILD_ID = payload.buildId;
  D = {
    items: (payload.items || []).filter(i => i.photo),
    categories: Array.isArray(payload.categories) && payload.categories.length ? payload.categories : null,
    thumbs: payload.categoryThumbs || {},
    service: payload.serviceCharge ?? 15,
    r: { name: ri.name, address: ri.address, phone: ri.phone, phoneDisplay: ri.phoneDisplay, phone2: ri.phone2, phone2Display: ri.phone2Display,
         hoursFull: ri.hoursFull, hoursShort: ri.hoursShort, maps: ri.maps }
  };
  D.items.forEach(i => byId[i.id] = i);
  if (!D.categories) D.categories = [...new Set(D.items.map(i => i.category))].map(id => ({ id, uz: id, ru: id, en: id }));
  cats = D.categories.filter(c => D.items.some(i => i.category === c.id));
  const qs = new URLSearchParams(location.search);
  if (T[qs.get('lang')]) lang = qs.get('lang');
  chrome(); showHome();
  if (qs.get('cat') && cats.some(c => c.id === qs.get('cat'))) openCat(qs.get('cat'));
  if (qs.get('item') && byId[qs.get('item')]) openDish(qs.get('item'));

  // ---- tekshiruv paneli (?diag=1) ----
  if (qs.get('diag')) {
    const box = document.createElement('pre');
    box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:999;max-height:60vh;overflow:auto;margin:0;padding:12px;border-radius:12px;background:rgba(0,0,0,.88);color:#9ff0b8;font:12px/1.45 monospace;white-space:pre-wrap;pointer-events:none';
    document.body.append(box);
    let frames = 0, fps = 0, worst = 0, lastT = performance.now();
    (function f(t) { frames++; worst = Math.max(worst, t - lastT); lastT = t; requestAnimationFrame(f); })(lastT);
    const VE = { 1: 'to\'xtatildi', 2: 'tarmoq xatosi', 3: 'ochib bo\'lmadi (decode)', 4: 'format qo\'llanmaydi' };
    setInterval(() => {
      fps = frames; frames = 0;
      const c = navigator.connection || {}, v = $('vid');
      const canH264 = document.createElement('video').canPlayType('video/mp4; codecs="avc1.4D401F"');
      box.textContent = [
        'Qurilma: ' + navigator.userAgent,
        'Ekran: ' + innerWidth + 'x' + innerHeight + '  DPR ' + devicePixelRatio + '  RAM ' + (navigator.deviceMemory || '?') + ' GB  yadro ' + (navigator.hardwareConcurrency || '?'),
        'Internet: turi=' + (c.type || '?') + '  tezlik=' + (c.effectiveType || '?') + '  tejash=' + (c.saveData ? 'HA' : 'yo\'q') + '  onlayn=' + navigator.onLine,
        'Animatsiyani kamaytirish: ' + (REDUCED ? 'YOQILGAN' : 'yo\'q'),
        'Video: ' + (v.currentSrc || v.querySelector('source').src).split('/').pop() + '  holat=' + v.readyState + '  ' + (v.paused ? 'TO\'XTAGAN' : 'o\'ynayapti')
          + '  vaqt=' + v.currentTime.toFixed(1) + '  o\'lcham=' + v.videoWidth + 'x' + v.videoHeight + '  xato=' + (v.error ? v.error.code + ' ' + (VE[v.error.code] || '') : 'yo\'q'),
        'H.264 Main qo\'llaydimi: ' + (canH264 || 'YO\'Q'),
        'Kadr/soniya: ' + fps + '  eng uzun kadr: ' + Math.round(worst) + ' ms',
        'Service worker: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'faol' : 'yo\'q') + '  versiya: ' + BUILD_ID
      ].join('\n');
      worst = 0;
    }, 1000);
  }

  // ---- oflayn holat ----
  const offl = () => { $('offlineBanner').hidden = navigator.onLine; };
  addEventListener('online', offl); addEventListener('offline', offl); offl();
  // ---- service worker: internet uzilsa ham oxirgi saqlangan menyu ochiladi ----
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // ---- suratlarni fonda navbat bilan keshlash (faqat Wi-Fi, trafik tejash rejimi emas) ----
  setTimeout(() => {
    const c = navigator.connection || {};
    if (!navigator.onLine || c.saveData || c.type === 'cellular' || ['slow-2g', '2g', '3g'].includes(c.effectiveType)) return;
    const q = [...new Set(D.items.map(i => thumb(i.photo)).filter(Boolean))]; let qi = 0;
    const nap = ms => new Promise(r => setTimeout(r, ms));
    const w = async () => { while (qi < q.length) { if (!navigator.onLine) return; const u = q[qi++]; try { await fetch(u, { cache: 'force-cache' }); } catch (e) {} await nap(120); } };
    for (let k = 0; k < 3; k++) w();
  }, 4000);
  // ---- menyu yangilansa planshet o'zi qayta yuklanadi (faqat bosh sahifada, hech kim ishlatmayotganda) ----
  let lastTouch = Date.now();
  ['pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(ev => addEventListener(ev, () => lastTouch = Date.now(), { passive: true }));
  setInterval(async () => {
    if (!navigator.onLine) return;
    try {
      const html = await (await fetch('index.html', { cache: 'no-store' })).text();
      const m = html.match(/"buildId":(\d+)/);
      if (m && +m[1] !== BUILD_ID && view === 'home' && !openKind && pick.size === 0 && scrollY < 40 && Date.now() - lastTouch > 60000) location.reload();
    } catch (e) {}
  }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
